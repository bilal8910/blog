<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<style>:root{--bg:#0A0E1A;--sur:#111827;--card:#161F2E;--card2:#1C2840;--bdr:#243047;--bdr2:#2E3D55;--txt:#EEF2F7;--dim:#8A9BB8;--fnt:#4A5A72;--gld:#F0B429;--gld2:#D4922A;--ga:rgba(240,180,41,.13);--gb:rgba(240,180,41,.27);--grn:#34D399;--gra:rgba(52,211,153,.13);--red:#F87171;--ra:rgba(248,113,113,.13);--blu:#60A5FA;--bla:rgba(96,165,250,.13);--pur:#A78BFA;--pua:rgba(167,139,250,.13);--tel:#2DD4BF;--tea:rgba(45,212,191,.13);--nav:68px;--hdr:60px;--tr:.2s cubic-bezier(.4,0,.2,1);--fn:"IBM Plex Sans Arabic",system-ui,sans-serif}
[data-theme=light]{--bg:#F0F4FA;--sur:#fff;--card:#fff;--card2:#F8FAFE;--bdr:#E2E8F0;--bdr2:#CBD5E1;--txt:#0F172A;--dim:#475569;--fnt:#94A3B8;--gld:#D97706;--gld2:#B45309;--ga:rgba(217,119,6,.1);--gb:rgba(217,119,6,.2);--grn:#059669;--gra:rgba(5,150,105,.1);--red:#DC2626;--ra:rgba(220,38,38,.1);--blu:#2563EB;--bla:rgba(37,99,235,.1);--pur:#7C3AED;--pua:rgba(124,58,237,.1);--tel:#0D9488;--tea:rgba(13,148,136,.1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--fn);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:4px}
#app{min-height:100vh;padding-bottom:calc(var(--nav) + 8px)}
.topbar{position:sticky;top:0;z-index:100;height:var(--hdr);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.bp{width:9px;height:9px;border-radius:50%;background:var(--gld);animation:pr 2.5s ease-in-out infinite}
@keyframes pr{0%,100%{box-shadow:0 0 0 0 var(--ga)}50%{box-shadow:0 0 0 8px transparent}}
.tbr{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--bdr);font-size:16px;transition:var(--tr)}
.ib:hover{background:var(--card2);transform:scale(1.05)}.ib:active{transform:scale(.95)}
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);display:flex;background:color-mix(in srgb,var(--sur) 95%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--bdr);z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--fnt);transition:color var(--tr);position:relative;padding-top:4px}
.ni{font-size:21px;line-height:1;transition:transform var(--tr)}.nb.active{color:var(--gld)}.nb.active .ni{transform:scale(1.15)}
.nb.active::after{content:"";position:absolute;bottom:calc(var(--nav) - 2px);width:28px;height:3px;border-radius:3px;background:var(--gld)}
.nb:active .ni{transform:scale(.9)}
.page{max-width:760px;margin:0 auto;padding:14px 14px 0;animation:fu .3s ease both}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sh{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.st{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.4px}.sa{font-size:12px;color:var(--gld);font-weight:500;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:16px}.card+.card{margin-top:10px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.ct{font-size:13px;font-weight:600;color:var(--dim)}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.s2{grid-column:span 2}.b3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;right:0;width:56px;height:56px;border-radius:50%;background:var(--ac,var(--ga));transform:translate(20px,-20px);pointer-events:none}
.si{font-size:20px;margin-bottom:8px;display:block}.sv{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ac2,var(--gld));line-height:1.1}.sl{font-size:11px;color:var(--fnt);margin-top:3px}
.ag{--ac:var(--ga);--ac2:var(--gld)}.agr{--ac:var(--gra);--ac2:var(--grn)}.ar{--ac:var(--ra);--ac2:var(--red)}.ab{--ac:var(--bla);--ac2:var(--blu)}.ap{--ac:var(--pua);--ac2:var(--pur)}.at{--ac:var(--tea);--ac2:var(--tel)}
.score-hero{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--bdr2);border-radius:24px;padding:20px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.score-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 0%,var(--ga),transparent 60%);pointer-events:none}
.rw{position:relative;width:104px;height:104px;flex-shrink:0}.rw svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--bdr2);stroke-width:9}.rf{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rn{font-size:28px;font-weight:700;line-height:1}.rl{font-size:9px;color:var(--fnt);margin-top:1px}
.si2{flex:1;min-width:0}.si2 h3{font-size:15px;font-weight:700;margin-bottom:4px}.si2 p{font-size:12.5px;color:var(--dim);line-height:1.55}
.sbars{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.sbar{display:flex;align-items:center;gap:8px;font-size:11px}.sbl{width:44px;color:var(--fnt);flex-shrink:0}.sbt{flex:1;height:5px;background:var(--bdr);border-radius:3px;overflow:hidden}.sbf{height:100%;border-radius:3px;transition:width .8s ease}.sbv{width:28px;text-align:left;color:var(--dim);flex-shrink:0}
.quote{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;font-size:13px;color:var(--dim);margin-bottom:14px;border-right:3px solid var(--gld)}
.pbar{height:5px;background:var(--bdr);border-radius:3px;overflow:hidden}.pbf{height:100%;border-radius:3px;background:var(--gld);transition:width .6s ease}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;background:var(--card);border:1px solid var(--bdr);color:var(--dim);white-space:nowrap;flex-shrink:0;transition:var(--tr);cursor:pointer}
.tab.active{background:var(--gld);color:#0A0E1A;border-color:var(--gld);font-weight:700}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;font-weight:500}
.inp{width:100%;background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:11px 12px;font-size:14px;transition:border-color var(--tr)}.inp:focus{border-color:var(--gld);outline:none;box-shadow:0 0 0 3px var(--ga)}.inp::placeholder{color:var(--fnt)}
.seg{display:flex;border:1px solid var(--bdr);border-radius:10px;overflow:hidden}.seg button{flex:1;padding:10px 4px;font-size:12px;background:var(--card);border-left:1px solid var(--bdr);transition:var(--tr);cursor:pointer}.seg button:first-child{border-left:none}.seg button.active{background:var(--gld);color:#0A0E1A;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:var(--tr);cursor:pointer}.btn:active{transform:scale(.96)}
.btp{background:var(--gld);color:#0A0E1A}.btp:hover{background:var(--gld2)}.bts{background:var(--card2);color:var(--txt);border:1px solid var(--bdr)}.btd{background:var(--ra);color:var(--red);border:1px solid var(--ra)}.btg{color:var(--dim);padding:8px 12px}.bb{width:100%}.bsm{padding:7px 12px;font-size:12px}
.fab{position:fixed;bottom:calc(var(--nav) + 16px);left:18px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--gld),var(--gld2));color:#0A0E1A;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px var(--gb);z-index:90;transition:var(--tr);cursor:pointer}
.fab:hover{transform:scale(1.1)}.fab:active{transform:scale(.9)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--sur);border-radius:24px 24px 0 0;width:100%;max-width:760px;padding:0 18px 24px;max-height:92vh;overflow-y:auto;animation:su .3s cubic-bezier(.32,.72,0,1);padding-bottom:calc(24px + env(safe-area-inset-bottom,0))}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.shdl{width:36px;height:4px;background:var(--bdr2);border-radius:4px;margin:14px auto 18px}.sht{font-size:17px;font-weight:700;margin-bottom:16px}
.toast{position:fixed;bottom:calc(var(--nav) + 20px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--sur);border:1px solid var(--bdr2);color:var(--txt);padding:12px 22px;border-radius:40px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.32,.72,0,1);white-space:nowrap;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.ok::before{content:"✅ "}.toast.err::before{content:"❌ "}.toast.info::before{content:"ℹ️ "}
.empty{text-align:center;padding:40px 20px;color:var(--fnt)}.ei{font-size:40px;margin-bottom:12px;display:block;opacity:.7}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bdr)}.li:last-child{border-bottom:none}
.lio{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.lib{flex:1;min-width:0}.lit{font-size:14px;font-weight:500}.lis{font-size:12px;color:var(--fnt);margin-top:2px}
.tck{width:22px;height:22px;border-radius:7px;border:2px solid var(--bdr2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:var(--tr);cursor:pointer}
.tck.done{background:var(--grn);border-color:var(--grn);color:#0A0E1A}
.pb{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
.pu{background:var(--ra);color:var(--red)}.pm{background:var(--ga);color:var(--gld)}.pl{background:var(--bla);color:var(--blu)}
.bh{background:linear-gradient(160deg,var(--ga),var(--card));border:1px solid var(--bdr2);border-radius:24px;padding:24px;text-align:center}
.bhl{font-size:12px;color:var(--dim)}.bhv{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.bsp{display:flex;justify-content:center;gap:28px;margin-top:14px}.bspv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}.bspl{font-size:10px;color:var(--fnt);margin-top:2px}
.wxh{background:linear-gradient(160deg,#1a3a5c,var(--card));border-radius:24px;border:1px solid var(--bdr);padding:22px;text-align:center}[data-theme=light] .wxh{background:linear-gradient(160deg,#dbeafe,#f0f9ff)}
.wxt{font-size:60px;font-weight:800;line-height:1;letter-spacing:-2px}.wxd{font-size:15px;color:var(--dim);margin-top:4px}.wxl{font-size:12px;color:var(--fnt);margin-top:2px}
.wxg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.wxm{background:rgba(255,255,255,.06);border-radius:10px;padding:10px;text-align:center}[data-theme=light] .wxm{background:rgba(0,0,0,.05)}
.wmi{font-size:20px}.wmv{font-size:14px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.wml{font-size:10px;color:var(--fnt);margin-top:1px}
.fcr{display:flex;align-items:center;padding:10px 4px;border-bottom:1px solid var(--bdr);font-size:13px}.fcr:last-child{border-bottom:none}
.fcd{width:64px;color:var(--dim)}.fci{font-size:20px;margin:0 12px}.fcc{flex:1;color:var(--fnt);font-size:11px}.fct{display:flex;gap:8px;font-variant-numeric:tabular-nums}.fcm{font-weight:700}.fcn{color:var(--fnt)}
.hr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bdr)}.hr:last-child{border-bottom:none}
.hio{font-size:24px;flex-shrink:0;width:36px;text-align:center}.hbd{flex:1;min-width:0}.hn{font-size:14px;font-weight:500}
.hpr{display:flex;align-items:center;gap:8px;margin-top:5px}.hpb{flex:1;height:4px;background:var(--bdr);border-radius:3px;overflow:hidden}.hpf{height:100%;border-radius:3px;transition:width .6s ease}
.hck{width:30px;height:30px;border-radius:50%;border:2px solid var(--bdr2);display:flex;align-items:center;justify-content:center;font-size:13px;transition:var(--tr);flex-shrink:0;cursor:pointer}.hck.done{background:var(--grn);border-color:var(--grn);color:#0A0E1A}
.wtr{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.wc{width:32px;height:36px;border-radius:0 0 8px 8px;border:2px solid var(--blu);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;cursor:pointer;transition:var(--tr)}.wc.f::before{content:"";position:absolute;bottom:0;left:0;right:0;background:var(--blu);height:100%}.wct{font-size:8px;position:relative;z-index:1;padding-bottom:2px;color:var(--fnt)}.wc.f .wct{color:white}
.ss2{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}
.sc{background:var(--gra);color:var(--grn)}.sm{background:var(--ga);color:var(--gld)}.sr2{background:var(--ra);color:var(--red)}.sd{background:var(--ra);color:var(--red);animation:bl .8s step-end infinite}
@keyframes bl{50%{opacity:.4}}
.barch{display:flex;align-items:flex-end;gap:4px;height:80px}.barc{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}.barf{width:100%;border-radius:4px 4px 0 0;min-height:2px;transition:height .6s ease}.barl{font-size:9px;color:var(--fnt)}
.prc{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:14px;margin-bottom:8px}
.prh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.prn{font-size:15px;font-weight:700}.prp{font-size:13px;font-weight:700;color:var(--gld)}
.prb{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;margin-bottom:10px}.prf{height:100%;background:linear-gradient(90deg,var(--gld),var(--grn));border-radius:3px;transition:width .8s ease}
.prm{display:flex;gap:12px;font-size:11px;color:var(--fnt)}
.cst{background:var(--card2);border:1px solid var(--bdr);border-radius:14px;padding:12px;text-align:center}.csv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}.csl{font-size:10px;color:var(--fnt);margin-top:2px}
.ic{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.icp{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}.icb{flex:1;min-width:0}.ict{font-size:13px;font-weight:600}.icm{font-size:11px;color:var(--fnt);margin-top:2px}
.sb{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
.s-idea{background:var(--pua);color:var(--pur)}.s-filming{background:var(--ga);color:var(--gld)}.s-editing{background:var(--bla);color:var(--blu)}.s-published{background:var(--gra);color:var(--grn)}.s-scheduled{background:var(--tea);color:var(--tel)}
.ins{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--card2);border-radius:14px;margin-bottom:8px;border-right:3px solid var(--bdr2)}
.ins.good{border-right-color:var(--grn)}.ins.warn{border-right-color:var(--red)}.ins.info{border-right-color:var(--blu)}
.ini{font-size:20px;flex-shrink:0}.int{font-size:13px;color:var(--dim);line-height:1.55}
.bmim{height:12px;border-radius:6px;overflow:hidden;background:linear-gradient(to right,var(--blu) 0%,var(--grn) 35%,var(--grn) 50%,var(--gld) 65%,var(--red) 80%,var(--red) 100%);position:relative;margin:12px 0}
.bmin{position:absolute;top:50%;width:3px;height:140%;background:var(--txt);border-radius:3px;transform:translate(-50%,-50%);transition:left 1s ease}
.bmil{display:flex;justify-content:space-between;font-size:9px;color:var(--fnt);margin-top:4px}
.spin{display:inline-block;width:30px;height:30px;border:3px solid var(--bdr);border-top-color:var(--gld);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.nbdg{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--red);color:white;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--bg)}
.catg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.catb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:var(--card);border:1px solid var(--bdr);font-size:11px;cursor:pointer;transition:var(--tr)}.catb.active{border-color:var(--gld);background:var(--ga)}
@media(min-width:860px){
  .bnav{top:0;bottom:auto;left:0;right:auto;width:200px;height:100vh;flex-direction:column;border-top:none;border-left:1px solid var(--bdr);padding-top:80px;justify-content:flex-start;gap:2px}
  .nb{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 20px;font-size:13px;border-radius:0 12px 12px 0;margin:0 8px;width:calc(100% - 16px)}
  .nb.active{background:var(--ga)}.nb.active::after{top:auto;bottom:auto;right:0;width:3px;height:60%;left:auto}.ni{font-size:18px}
  #app{padding-right:200px;padding-bottom:0}.topbar{padding-right:224px}.fab{right:calc(200px + 20px);left:auto;bottom:24px}
}</style>
</head>
<body data-theme="dark">
<div id="app">
  <header class="topbar">
    <div class="brand"><div class="bp"></div>LifeHub <span style="font-size:11px;color:var(--fnt);font-weight:400">2.0</span></div>
    <div class="tbr">
      <div style="position:relative"><button class="ib" id="nBtn">🔔</button><div class="nbdg" id="nBdg" style="display:none">0</div></div>
      <button class="ib" id="thBtn">🌙</button>

    </div>

</div>

// ── LIFE SCORE ──
function calcScore(){
  var tasks=sg(SK.T),fin=sg(SK.F),hb=sg(SK.HB),td=today();
  var tdy=tasks.filter(function(t){return sameDay(t.createdAt,td)||sameDay(t.dueAt,td)});
  var tPct=tdy.length===0?50:pct(tdy.filter(function(t){return t.done}).length,tdy.length);
  var tS=Math.round(tPct/100*20);
  var txs=fin.transactions;
  var tE=txs.filter(function(t){return t.type==='expense'&&sameDay(t.date,td)}).reduce(function(a,t){return a+Number(t.amount)},0);
  var l6=last7().slice(0,6).map(function(d){return txs.filter(function(t){return t.type==='expense'&&sameDay(t.date,d)}).reduce(function(a,t){return a+Number(t.amount)},0)});
  var avg=l6.length?l6.reduce(function(a,b){return a+b},0)/l6.length:0;
  var fS=avg===0?14:tE<=avg?20:tE<=avg*1.3?12:6;
  var slH=hb.sleep&&hb.sleep.log&&hb.sleep.log[td]?hb.sleep.log[td].hours||0:0;
  var slS=slH===0?0:Math.round(clamp(slH>=7&&slH<=9?1:slH<7?slH/7:9/slH,0,1)*15);
  var spD=hb.sport&&hb.sport.log&&hb.sport.log[td]?hb.sport.log[td].done||false:false;
  var spS=spD?15:0;
  var wkSt=hb.walk&&hb.walk.log&&hb.walk.log[td]?hb.walk.log[td].steps||0:0;
  var wkS=Math.round(clamp(wkSt/8000,0,1)*10);
  var wtT=hb.water&&hb.water.target?hb.water.target:8;
  var wtD=hb.water&&hb.water.log&&hb.water.log[td]?hb.water.log[td].cups||0:0;
  var waS=Math.round(clamp(wtD/wtT,0,1)*10);
  var mood=hb.sleep&&hb.sleep.log&&hb.sleep.log[td]?hb.sleep.log[td].mood||5:5;
  var mS=Math.round(clamp(mood/10,0,1)*10);
  return {total:clamp(tS+fS+slS+spS+wkS+waS+mS,0,100),b:{tS:tS,fS:fS,slS:slS,spS:spS,wkS:wkS,waS:waS,mS:mS,tPct:tPct,tdyLen:tdy.length,doneLen:tdy.filter(function(t){return t.done}).length,slH:slH,spD:spD,wkSt:wkSt,wtD:wtD,wtT:wtT,mood:mood}};
}

function scoreTips(b){
  var s=[];

}

/* ── Hijri Calendar Engine ── */
function gregorianToHijri(date){
  var d=date||new Date();
  var JD=Math.floor((1461*(d.getFullYear()+4800+Math.floor((d.getMonth()+1-14)/12)))/4)+
         Math.floor((367*(d.getMonth()+1-2-12*Math.floor((d.getMonth()+1-14)/12)))/12)-
         Math.floor((3*Math.floor((d.getFullYear()+4900+Math.floor((d.getMonth()+1-14)/12))/100))/4)+
         d.getDate()-32075;
  var Z=JD-1948440+10632;
  var N=Math.floor((Z-1)/10631);
  Z=Z-10631*N+354;
  var J=Math.floor((10985-Z)/5965);
  Z=Z-Math.floor((J*29029+29)/50)*J;
  var Y=Math.floor(Z*30/10631);
  Z=Z-Math.floor((Y*29029+29)/50)-Math.floor(Y/2);
  var M=Math.floor((Z-1)/30);
  var D=Z-30*M-Math.floor(M/2);
  var HY=30*N+Y+J;
  return {year:HY, month:M+1, day:D};
}
var HIJRI_MONTHS=['محرم','صفر','ربيع الأول','ربيع الثاني','جمادى الأولى','جمادى الثانية','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
function formatHijri(date){
  var h=gregorianToHijri(date||new Date());
  return h.day+' '+HIJRI_MONTHS[h.month-1]+' '+h.year+'هـ';
}

/* ── Prayer Times Engine ── */
var PRAYER_NAMES={Fajr:'الفجر',Sunrise:'الشروق',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
var PRAYER_ICONS={Fajr:'🌙',Sunrise:'🌅',Dhuhr:'☀️',Asr:'🌤️',Maghrib:'🌆',Isha:'🌃'};
var _prayerCache={data:null,date:null,loading:false};


/* Local prayer calculation - no internet needed */
function calcPrayerTimes(lat,lon){
  var D2R=Math.PI/180, R2D=180/Math.PI;
  var now=new Date();
  var JD=Math.floor(365.25*(now.getFullYear()+4716))+Math.floor(30.6001*(now.getMonth()+2))+now.getDate()-1537.5;
  var T=(JD-2451545)/36525;
  var L0=(280.46646+36000.76983*T)%360;
  var M=(357.52911+35999.05029*T)*D2R;
  var C=(1.914602-0.004817*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M);
  var sunLon=(L0+C)*D2R;
  var e=(23.439291-0.013004*T)*D2R;
  var RA=R2D*Math.atan2(Math.cos(e)*Math.sin(sunLon),Math.cos(sunLon))/15;
  var decl=R2D*Math.asin(Math.sin(e)*Math.sin(sunLon));
  var EqT=L0/15-RA; if(EqT>0.5)EqT-=24; if(EqT<-0.5)EqT+=24;
  var TZ=Math.round(lon/15);
  var transit=12-EqT-((lon-TZ*15)/15);

  function hourAngle(alt){
    var a=Math.sin(alt*D2R)-Math.sin(lat*D2R)*Math.sin(decl*D2R);
    var b=Math.cos(lat*D2R)*Math.cos(decl*D2R);
    var c=a/b; if(c<-1)c=-1; if(c>1)c=1;
    return R2D*Math.acos(c)/15;
  }
  function toTime(h){h=(h+TZ+24)%24;var hh=Math.floor(h),mm=Math.round((h-hh)*60);if(mm>=60){hh++;mm=0}return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;}

  var fajrHA  =hourAngle(-18);   // Fajr: sun 18° below horizon (MWL)
  var sunriseHA=hourAngle(-0.833);
  var asrAlt  =R2D*Math.atan(1+Math.tan(Math.abs(lat-decl)*D2R));// Standard (Shafi)
  var asrHA   =hourAngle(asrAlt);
  var maghribHA=sunriseHA;       // Maghrib = sunset
  var ishaHA  =hourAngle(-17);   // Isha: 17° (MWL)

  return {
    Fajr:    toTime(transit-fajrHA),
    Sunrise: toTime(transit-sunriseHA),
    Dhuhr:   toTime(transit+0.05),
    Asr:     toTime(transit+asrHA),
    Maghrib: toTime(transit+maghribHA),
    Isha:    toTime(transit+ishaHA)
  };
}
function fetchPrayerTimes(lat,lon){
  try{return Promise.resolve(calcPrayerTimes(lat,lon));}
  catch(e){return Promise.reject(e);}
}

function getPrayerTimes(cb){
  var pr=sg(SK.PR);
  var lat=pr.lat,lon=pr.lon;
  var tStr=new Date().toISOString().slice(0,10);
  if(_prayerCache.data&&_prayerCache.date===tStr){cb(null,_prayerCache.data);return;}
  function doCalc(la,lo){
    try{
      var t=calcPrayerTimes(la,lo);
      _prayerCache={data:t,date:tStr,loading:false};
      cb(null,t);
    }catch(e){cb(e,null);}
  }
  if(lat&&lon){doCalc(lat,lon);return;}
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(p){
        su(SK.PR,function(s){s.lat=p.coords.latitude;s.lon=p.coords.longitude;});
        doCalc(p.coords.latitude,p.coords.longitude);
      },
      function(){
        /* Default: Casablanca if geolocation denied */
        su(SK.PR,function(s){s.lat=33.5731;s.lon=-7.5898;s.city='الدار البيضاء';});
        doCalc(33.5731,-7.5898);
      },
      {timeout:5000}
    );
  } else {
    su(SK.PR,function(s){s.lat=33.5731;s.lon=-7.5898;s.city='الدار البيضاء';});
    doCalc(33.5731,-7.5898);
  }
}

function getNextPrayer(timings){
  var now=new Date();
  var nowMin=now.getHours()*60+now.getMinutes();
  var keys=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
  var current=null,next=null;
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    var t=timings[k];
    if(!t)continue;
    var parts=t.split(':');
    var pMin=parseInt(parts[0])*60+parseInt(parts[1]);
    if(nowMin>=pMin)current={name:k,time:t,min:pMin};
    if(nowMin<pMin&&!next)next={name:k,time:t,min:pMin};
  }
  if(!next){next={name:'Fajr',time:timings['Fajr'],min:0};} // next day Fajr
  return{current:current,next:next};
}

function prayerCountdown(nextMin){
  var now=new Date();
  var nowMin=now.getHours()*60+now.getMinutes();
  var diff=nextMin-nowMin;
  if(diff<0)diff+=1440;
  var h=Math.floor(diff/60),m=diff%60;
  return (h?h+'س ':'')+m+'د';
}

/* ── Sleep Reminder Engine ── */
function scheduleSleepReminders(){
  var sl=sg(SK.SL);
  if(!sl.bedtime)return;
  var parts=sl.bedtime.split(':');
  var bedH=parseInt(parts[0]),bedM=parseInt(parts[1]);
  var now=new Date();
  function msUntil(h,m){
    var t=new Date();t.setHours(h,m,0,0);
    if(t<=now)t.setDate(t.getDate()+1);
    return t-now;
  }
  if(sl.remind60&&'Notification' in window&&Notification.permission==='granted'){
    var m60=msUntil(bedH,bedM)-3600000;
    if(m60>0)setTimeout(function(){new Notification('LifeHub — وقت النوم',{body:'باقي ساعة على وقت نومك 😴'})},m60);
  }
  if(sl.remind30&&'Notification' in window&&Notification.permission==='granted'){
    var m30=msUntil(bedH,bedM)-1800000;
    if(m30>0)setTimeout(function(){new Notification('LifeHub — وقت النوم',{body:'باقي 30 دقيقة على وقت نومك 🌙'})},m30);
  }
  var mBed=msUntil(bedH,bedM);
  if(mBed>0&&'Notification' in window&&Notification.permission==='granted'){
    setTimeout(function(){new Notification('LifeHub — وقت النوم',{body:'حان وقت النوم الآن 😴 '+sl.bedtime})},mBed);
  }

var _sportsPrompt='أنت محلل رياضي. اكتب 8 أخبار رياضية مهمة اليوم باللغة العربية، ركز على كرة القدم والانتقالات والبطولات. أرجع JSON فقط، بدون أي نص إضافي: [{"title":"عنوان الخبر","desc":"ملخص من جملتين","source":"المصدر"},...]';

function loadSportsNews(cb){
  var age=_sportsCache.ts?Date.now()-_sportsCache.ts:Infinity;
  if(_sportsCache.items&&age<3600000){cb(_sportsCache.items);return;}
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'anthropic-version':'2023-06-01'
    },
    body:JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:2000,
      messages:[{role:'user',content:_sportsPrompt}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var text=(d.content&&d.content[0]&&d.content[0].text)||'';
    var clean=text.replace(/```json|```/g,'').trim();
    var items=JSON.parse(clean);
    if(!Array.isArray(items)||!items.length)throw new Error('empty');
    _sportsCache={items:items,ts:Date.now()};
    cb(items);
  })
  .catch(function(){
    var fallback=[
      {title:'تعذّر تحميل الأخبار الرياضية',desc:'تأكد من اتصالك بالإنترنت ثم اضغط تحديث للمحاولة مجدداً.',source:'—'}
    ];
    _sportsCache={items:fallback,ts:0};
    cb(fallback);
  });
}
function clipboardCopy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('تم النسخ','ok')}).catch(function(){_fallbackCopy(text)});}
  else{_fallbackCopy(text);}
}
function _fallbackCopy(text){
  var t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('تم النسخ','ok');}catch(e){toast('تعذّر النسخ','err');}document.body.removeChild(t);
}
function generateScript(title,desc){
  return 'السلام عليكم ومرحباً بكم\n\n📌 '+title+'\n\n'+desc+'\n\nلا تنسوا الإشتراك والإعجاب لمتابعة آخر الأخبار الرياضية! ⚽';
}
function generateHashtags(title){
  var words=title.split(/\s+/).filter(function(w){return w.length>2}).slice(0,4);
  var tags=words.map(function(w){return '#'+w.replace(/[^\u0600-\u06FFa-zA-Z0-9]/g,'')}).filter(function(t){return t.length>1});
  return tags.join(' ')+' #كرة_القدم #أخبار_رياضية #فوتبول';
}

function loadPrayerView(){
  _prayerViewLoading=true;_prayerViewErr=null;render();

    _prayerViewLoading=false;
    if(err){_prayerViewErr='تعذّر حساب أوقات الصلاة. أدخل موقعك يدوياً.';render();return;}
    _prayerViewData=data;render();
    if('Notification' in window&&Notification.permission==='granted')schedulePrayerNotifs(data);
  });
}
function schedulePrayerNotifs(timings){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var pr=sg(SK.PR);var mins=pr.notifBefore||10;
  ['Fajr','Dhuhr','Asr','Maghrib','Isha'].forEach(function(k){
    var t=timings[k];if(!t)return;
    var parts=t.split(':');var h=parseInt(parts[0]),m=parseInt(parts[1]);
    var now=new Date();var pDate=new Date();pDate.setHours(h,m,0,0);
    var notifTime=new Date(pDate.getTime()-mins*60000);
    var delay=notifTime-now;
    if(delay>0)setTimeout(function(){new Notification('LifeHub 🕌 '+(PRAYER_NAMES[k]||k),{body:'صلاة '+(PRAYER_NAMES[k]||k)+' بعد '+mins+' دقيقة'})},delay);
  });
}

var WXD=null,WXLD=false,WXER=null,WXTB='weather';
var TF='all';
var FTAB='tx';
var HTAB='habits';
var MTAB='projects';

function render(){
  var root=document.getElementById('root');
  if(!root)return;
  if(CUR==='dashboard')root.innerHTML=rDash();
  else if(CUR==='tasks')root.innerHTML=rTasks();
  else if(CUR==='finance')root.innerHTML=rFinance();
  else if(CUR==='health')root.innerHTML=rHealth();
  else if(CUR==='weather')root.innerHTML=rWeather();
  else if(CUR==='more')root.innerHTML=rMore();
  else if(CUR==='prayer')root.innerHTML=rPrayer();
  else if(CUR==='sports')root.innerHTML=rSports();
  else if(CUR==='modules')root.innerHTML=rModules();
  else if(CUR==='prayer')root.innerHTML=rPrayer();
  else if(CUR==='sports')root.innerHTML=rSports();
  else if(CUR==='modules')root.innerHTML=rModules();
  afterRender();
  attachDynamic();
}

function goto(p){
  CUR=p;
  var NM={dashboard:'dashboard',tasks:'tasks',finance:'finance',health:'health',weather:'more',more:'more',prayer:'prayer',sports:'sports',modules:'more'};
  document.querySelectorAll('.nb').forEach(function(b){b.classList.toggle('active',b.dataset.p===(NM[p]||p))});
  render();
}

function afterRender(){
  if(CUR==='prayer'&&!_prayerViewData&&!_prayerViewLoading&&!_prayerViewErr){loadPrayerView();return}
  if(CUR==='sports'&&!_sportsItems&&!_sportsLoading&&!_sportsErr){
    _sportsLoading=true;
    loadSportsNews(function(items){
      _sportsLoading=false;
      if(!items||items.length===0){_sportsErr='لم يتم العثور على أخبار. تحقق من الاتصال بالإنترنت.';}
      else{_sportsItems=items;}
      render();
    });
    return;
  }
  if(CUR==='prayer'&&!_prayerViewData&&!_prayerViewLoading&&!_prayerViewErr){loadPrayerView();return;}
  if(CUR==='sports'&&!_sportsItems&&!_sportsLoading&&!_sportsErr){_sportsLoading=true;loadSportsNews(function(items){_sportsLoading=false;if(!items||!items.length){_sportsErr='لم تُعثر على أخبار.';}else{_sportsItems=items;}render();});return;}
  if(CUR==='weather'&&!WXD&&!WXLD){
    WXLD=true;
    wxLoad().then(function(d){WXD=d;WXLD=false;render()}).catch(function(e){WXER=e.message;WXLD=false;render()});
    return;
  }
  if(CUR==='dashboard'&&!WXD&&!WXLD){
    WXLD=true;
    wxLoad().then(function(d){WXD=d;WXLD=false;
      var ei=document.getElementById('wxI');if(ei)ei.textContent=wxI(d.current.weather_code);
      var et=document.getElementById('wxT');if(et)et.textContent=Math.round(d.current.temperature_2m)+'°';
      var ed=document.getElementById('wxD');if(ed)ed.textContent=wxT(d.current.weather_code)||'—';
    }).catch(function(){WXLD=false;var ed=document.getElementById('wxD');if(ed)ed.textContent='تعذّر التحميل'});
  }
}

// ── EVENT DELEGATION (replaces all inline onclick with IDs) ──
document.addEventListener('click',function(e){
  var btn=e.target.closest('[data-fn]');
  if(!btn)return;
  var fn=btn.dataset.fn,id=btn.dataset.id;
  if(fn==='toggleTask')toggleTask(id);
  else if(fn==='delTask')delTask(id);
  else if(fn==='delTx')delTx(id);
  else if(fn==='delGoal')delGoal(id);
  else if(fn==='delIdea')delIdea(id);
  else if(fn==='delProj')delProj(id);
  else if(fn==='setFilter')setFilter(id);
  else if(fn==='goto')goto(id);
  else if(fn==='setFinTab'){FTAB=id;render()}
  else if(fn==='setHTab'){HTAB=id;render()}
  else if(fn==='setMTab'){MTAB=id;render()}
  else if(fn==='setWxTab'){WXTB=id;render()}
  else if(fn==='toggleHabit')toggleHabit(id);
  else if(fn==='setWater')setWater(parseInt(id));
  else if(fn==='addWater')addWater(parseInt(id));
  else if(fn==='toggleMod'){toggleMod(id)}
  else if(fn==='setSportsTab'){
    document.querySelectorAll('#sportsTabs .tab').forEach(function(b){b.classList.remove('active')});
    var aTab=document.querySelector('#sportsTabs [data-id="'+id+'"]');if(aTab)aTab.classList.add('active');
    var scEl=document.getElementById('sportsContent');
    if(scEl){
      if(id==='saved'){var svItems=sg(SK.SP).saved||[];scEl.innerHTML=svItems.length?svItems.map(function(item,i){return renderSportsItem(item,i,true)}).join(''):'<div class="empty"><span class="ei">💾</span><p>لا توجد أخبار محفوظة.</p></div>';}
      else{scEl.innerHTML=(_sportsItems&&_sportsItems.length)?_sportsItems.map(function(item,i){return renderSportsItem(item,i,false)}).join(''):'<div class="empty"><span class="ei">📰</span><p>لا توجد أخبار.</p></div>';}
    }
  }
  else if(fn==='copySportsNews'){var cItm=_sportsItems&&_sportsItems[parseInt(id)];if(cItm)clipboardCopy(cItm.title+'\n\n'+cItm.desc+'\n'+cItm.url)}
  else if(fn==='genSportsScript'){var gItm=_sportsItems&&_sportsItems[parseInt(id)];if(gItm)clipboardCopy(generateScript(gItm.title,gItm.desc))}
  else if(fn==='genSportsHash'){var hItm=_sportsItems&&_sportsItems[parseInt(id)];if(hItm)clipboardCopy(generateHashtags(hItm.title))}
  else if(fn==='saveSportsItem'){
    var sIdx3=parseInt(id);var sItm=_sportsItems&&_sportsItems[sIdx3];
    if(sItm){su(SK.SP,function(sp){if(!sp.saved)sp.saved=[];var ex=sp.saved.some(function(x){return x.url===sItm.url});if(!ex)sp.saved.push(sItm)});toast('تم الحفظ','ok')}
  }
});
document.addEventListener('click',function(e){
  var btn=e.target.closest('[data-seg]');
  if(!btn)return;
  var grp=btn.dataset.seg;
  document.querySelectorAll('[data-seg="'+grp+'"]').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
});
document.addEventListener('click',function(e){
  var btn=e.target.closest('[data-cat]');
  if(!btn)return;
  document.querySelectorAll('[data-cat]').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
});

// ══ DASHBOARD ══
function rDash(){
  var sc=calcScore(),tasks=sg(SK.T),fin=sg(SK.F),hb=sg(SK.HB),td=today();
  var ttx=fin.transactions.filter(function(t){return sameDay(t.date,td)});
  var tI=ttx.filter(function(t){return t.type==='income'}).reduce(function(a,t){return a+Number(t.amount)},0);
  var tE=ttx.filter(function(t){return t.type==='expense'}).reduce(function(a,t){return a+Number(t.amount)},0);
  var totI=fin.transactions.filter(function(t){return t.type==='income'}).reduce(function(a,t){return a+Number(t.amount)},0);
  var totE=fin.transactions.filter(function(t){return t.type==='expense'}).reduce(function(a,t){return a+Number(t.amount)},0);
  var bal=totI-totE;
  var pend=tasks.filter(function(t){return !t.done}).length;
  var top3=tasks.filter(function(t){return !t.done}).slice(0,3);
  var wtD=hb.water&&hb.water.log&&hb.water.log[td]?hb.water.log[td].cups||0:0;
  var wtT=hb.water&&hb.water.target?hb.water.target:8;
  var wkSt=hb.walk&&hb.walk.log&&hb.walk.log[td]?hb.walk.log[td].steps||0:0;
  var ins=genInsights(),tips=scoreTips(sc.b);
  var circ=2*Math.PI*42,dash=circ*(1-sc.total/100),clr=scColor(sc.total);
  var PLBL={urgent:'P1 عاجل',important:'P2 مهم',later:'P3 لاحقاً'};
  var PCLS={urgent:'pu',important:'pm',later:'pl'};
  var html='<div class="page">';
  html+='<div class="quote"><span>💡</span><span>'+quoteOfDay()+'</span></div>';
  html+='<div class="score-hero">';
  html+='<div class="rw"><svg viewBox="0 0 100 100"><circle class="rt" cx="50" cy="50" r="42"/><circle class="rf" cx="50" cy="50" r="42" stroke="'+clr+'" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+dash.toFixed(1)+'" style="filter:drop-shadow(0 0 8px '+clr+'88)"/></svg>';
  html+='<div class="rc"><span class="rn" style="color:'+clr+'">'+sc.total+'</span><span class="rl">/ 100</span></div></div>';
  html+='<div class="si2"><h3>Life Score — '+new Date().toLocaleDateString('ar-EG',{weekday:'long'})+'</h3><p>'+explainScore(sc.total)+'</p>';
  if(tips.length){html+='<div style="margin-top:8px">';tips.forEach(function(s){html+='<div style="font-size:11px;color:var(--gld);margin-top:3px">• '+s+'</div>'});html+='</div>'}
  html+='<div class="sbars">';
  var SB=[['مهام',sc.b.tS,20],['مالية',sc.b.fS,20],['نوم',sc.b.slS,15],['رياضة',sc.b.spS,15],['مشي',sc.b.wkS,10],['ماء',sc.b.waS,10]];
  SB.forEach(function(x){var p=Math.round(x[1]/x[2]*100);html+='<div class="sbar"><span class="sbl">'+x[0]+'</span><div class="sbt"><div class="sbf" style="width:'+p+'%;background:'+scColor(p)+'"></div></div><span class="sbv">'+x[1]+'/'+x[2]+'</span></div>'});
  html+='</div></div></div>';
  html+='<div class="sh"><span class="st">ملخص اليوم</span><span style="font-size:12px;color:var(--fnt)">'+fmtT()+'</span></div>';
  html+='<div class="bento">';
  html+='<div class="stat ar"><span class="si">💸</span><div class="sv">'+(tE>0?fmtM(tE):'—')+'</div><div class="sl">مصاريف اليوم</div></div>';
  html+='<div class="stat agr"><span class="si">💵</span><div class="sv">'+(tI>0?fmtM(tI):'—')+'</div><div class="sl">دخل اليوم</div></div>';
  html+='<div class="stat ag s2"><span class="si">🏦</span><div class="sv" style="font-size:26px">'+fmtM(bal,0)+'</div><div class="sl">الرصيد الكلي</div></div>';
  html+='<div class="stat ab"><span class="si">✅</span><div class="sv">'+pend+'</div><div class="sl">مهام متبقية</div></div>';
  html+='<div class="stat at"><span class="si">🚶</span><div class="sv">'+(wkSt>0?wkSt.toLocaleString('ar-EG'):'—')+'</div><div class="sl">خطوات اليوم</div></div>';
  html+='<div class="stat ab" style="cursor:pointer" data-fn="goto" data-id="weather"><span class="si" id="wxI">⏳</span><div class="sv" id="wxT" style="font-size:20px">--°</div><div class="sl" id="wxD">جارٍ التحميل</div></div>';
  html+=rDashPrayerWidget();
  html+=rDashHijriWidget();
  html+='<div class="stat ap"><span class="si">💧</span><div class="sv">'+wtD+'/'+wtT+'</div><div class="sl">أكواب الماء</div><div class="pbar" style="margin-top:6px"><div class="pbf" style="width:'+pct(wtD,wtT)+'%"></div></div></div>';
  html+='</div>';
  if(top3.length){
    html+='<div class="sh"><span class="st">أولويات اليوم</span><button class="sa" data-fn="goto" data-id="tasks">الكل →</button></div>';
    html+='<div class="card">';
    top3.forEach(function(t){

    });
    html+='</div>';
  }
  html+='<div class="sh"><span class="st">تحليلات ذكية</span></div>';
  ins.forEach(function(i){html+='<div class="ins '+i.c+'"><span class="ini">'+i.i+'</span><div class="int">'+i.t+'</div></div>'});
  html+='<div class="sh"><span class="st">إجراء سريع</span></div>';
  html+='<div class="b3" style="margin-bottom:16px">';
  [['✅','مهمة','tasks'],['💸','مصروف','finance'],['💧','ماء','health'],['🏃','رياضة','health'],['🌤️','الطقس','weather'],['📁','مشاريع','more']].forEach(function(x){
    html+='<button class="card" style="text-align:center;padding:12px 4px" data-fn="goto" data-id="'+x[2]+'">';
    html+='<div style="font-size:24px">'+x[0]+'</div><div style="font-size:11px;margin-top:6px;color:var(--dim)">'+x[1]+'</div></button>';
  });
  html+='</div></div>';
  return html;
}

// ══ TASKS ══
function rTasks(){
  var tasks=sg(SK.T);
  var filtered=TF==='all'?tasks:TF==='done'?tasks.filter(function(t){return t.done}):TF==='overdue'?tasks.filter(function(t){return !t.done&&t.dueAt&&new Date(t.dueAt)<new Date()}):tasks.filter(function(t){return !t.done&&t.priority===TF});
  var cn={all:tasks.length,urgent:tasks.filter(function(t){return !t.done&&t.priority==='urgent'}).length,important:tasks.filter(function(t){return !t.done&&t.priority==='important'}).length,later:tasks.filter(function(t){return !t.done&&t.priority==='later'}).length,overdue:tasks.filter(function(t){return !t.done&&t.dueAt&&new Date(t.dueAt)<new Date()}).length,done:tasks.filter(function(t){return t.done}).length};
  var TABS=[['all','الكل'],['urgent','🔴 عاجل'],['important','🟡 مهم'],['later','🔵 لاحقاً'],['overdue','⏰ متأخر'],['done','✅ منجز']];
  var PLBL={urgent:'P1 عاجل',important:'P2 مهم',later:'P3 لاحقاً'};
  var PCLS={urgent:'pu',important:'pm',later:'pl'};
  var html='<div class="page"><div class="sh" style="margin-top:8px"><span class="st">المهام والأولويات</span></div>';
  html+='<div class="tabs">';
  TABS.forEach(function(x){html+='<button class="tab'+(TF===x[0]?' active':'')+'" data-fn="setFilter" data-id="'+x[0]+'">'+x[1]+(cn[x[0]]?' ('+cn[x[0]]+')':'')+'</button>'});
  html+='</div><div class="card">';
  if(!filtered.length){
    html+='<div class="empty"><span class="ei">📋</span><p>'+(TF==='done'?'لا توجد مهام منجزة.':'لا توجد مهام.')+'</p></div>';
  } else {
    filtered.forEach(function(t){
      var od=t.dueAt&&new Date(t.dueAt)<new Date()&&!t.done;
      html+='<div class="li">';
      html+='<button class="tck'+(t.done?' done':'')+'" data-fn="toggleTask" data-id="'+esc(t.id)+'">'+(t.done?'✓':'')+'</button>';
      html+='<div class="lib"><div class="lit" style="'+(t.done?'text-decoration:line-through;color:var(--fnt)':'')+'">'+esc(t.title)+'</div>';
      html+='<div class="lis" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">';
      html+='<span class="pb '+(PCLS[t.priority]||'pl')+'">'+(PLBL[t.priority]||'')+'</span>';
      if(t.dueAt){var dStr=t.dueAt.slice(0,10);var tStr=t.dueAt.length>10?t.dueAt.slice(11,16):'';html+='<span style="font-size:10px;color:'+(od?'var(--red)':'var(--fnt)')+'">📅 '+fmtD(dStr)+(tStr?' '+tStr:'')+' </span>'}
      if(t.recur&&t.recur!=='once'){var RL={daily:'يومي',weekly:'أسبوعي',monthly:'شهري'};html+='<span style="font-size:10px;background:var(--tea);color:var(--tel);padding:1px 6px;border-radius:4px">🔄 '+(RL[t.recur]||t.recur)+'</span>'}
      if(t.reminder!==null&&t.reminder!==undefined){html+='<span style="font-size:10px;color:var(--pur)">🔔</span>'}
      if(t.project)html+='<span style="font-size:10px;color:var(--pur)">📁 '+esc(t.project)+'</span>';
      html+='</div></div>';
      html+='<button data-fn="delTask" data-id="'+esc(t.id)+'" style="color:var(--fnt);font-size:14px;padding:6px">🗑️</button>';
      html+='</div>';
    });
  }
  html+='</div></div><button class="fab" id="taskFab">+</button>';
  return html;
}
function setFilter(f){TF=f;render()}
function toggleTask(id){su(SK.T,function(ts){var t=ts.find(function(x){return x.id===id});if(t)t.done=!t.done});render()}
function delTask(id){if(!confirm('حذف هذه المهمة؟'))return;su(SK.T,function(ts){var i=ts.findIndex(function(x){return x.id===id});if(i>-1)ts.splice(i,1)});render();toast('تم الحذف','ok')}
function openAddTask(){
  var pj=sg(SK.P).map(function(p){return p.name});
  var h='<div class="shdl"></div><div class="sht">مهمة جديدة ✅</div>';
  h+='<div class="field"><label>عنوان المهمة *</label><input class="inp" id="tT" placeholder="اكتب المهمة..." autofocus></div>';
  // Priority with P-code
  h+='<div class="field"><label>الأولوية</label><div class="seg">';
  h+='<button class="active" data-seg="pri" data-val="urgent">🔴 P1 عاجل</button>';
  h+='<button data-seg="pri" data-val="important">🟡 P2 مهم</button>';
  h+='<button data-seg="pri" data-val="later">🔵 P3 لاحقاً</button></div></div>';
  // Date + Time row
  h+='<div class="field"><label>الموعد النهائي</label>';
  h+='<div style="display:flex;gap:8px">';
  h+='<input class="inp" type="date" id="tD" style="flex:2">';
  h+='<input class="inp" type="time" id="tTm" style="flex:1" placeholder="--:--">';
  h+='</div></div>';
  // Reminder
  h+='<div class="field"><label>تذكير 🔔</label>';
  h+='<select class="inp" id="tRem">';
  h+='<option value="">بدون تذكير</option>';
  h+='<option value="0">عند الموعد</option>';
  h+='<option value="10">قبل 10 دقائق</option>';
  h+='<option value="30">قبل 30 دقيقة</option>';
  h+='<option value="60">قبل ساعة</option>';
  h+='<option value="1440">قبل يوم كامل</option>';
  h+='</select></div>';
  // Recurring
  h+='<div class="field"><label>التكرار 🔄</label><div class="seg">';
  h+='<button class="active" data-seg="recur" data-val="once">مرة</button>';
  h+='<button data-seg="recur" data-val="daily">يومي</button>';
  h+='<button data-seg="recur" data-val="weekly">أسبوعي</button>';
  h+='<button data-seg="recur" data-val="monthly">شهري</button>';
  h+='</div></div>';
  if(pj.length){h+='<div class="field"><label>المشروع</label><select class="inp" id="tP"><option value="">بدون مشروع</option>';pj.forEach(function(p){h+='<option>'+esc(p)+'</option>'});h+='</select></div>'}
  h+='<div class="field"><label>ملاحظة</label><input class="inp" id="tN" placeholder="اختياري..."></div>';
  h+='<button class="btn btp bb" style="margin-top:10px" id="addTaskBtn">إضافة المهمة</button>';
  mshow(h);
  setTimeout(function(){
    var btn=document.getElementById('addTaskBtn');
    if(btn)btn.addEventListener('click',function(){
      var tt=(document.getElementById('tT')||{}).value||'';tt=tt.trim();
      if(!tt){toast('أدخل عنوان المهمة','err');return}
      var priBtn=document.querySelector('[data-seg="pri"].active');
      var pr=priBtn?priBtn.dataset.val||'later':'later';
      var du=(document.getElementById('tD')||{}).value||null;
      var pj2=(document.getElementById('tP')||{}).value||'';
      var nt=(document.getElementById('tN')||{}).value||'';nt=nt.trim();
      var tm=(document.getElementById('tTm')||{}).value||'';
      var dueAt=du?(du+(tm?'T'+tm:'')):null;
      var remVal=(document.getElementById('tRem')||{}).value||'';
      var reminder=remVal!==''?parseInt(remVal):null;
      var recurBtn=document.querySelector('[data-seg="recur"].active');
      var recur=recurBtn?recurBtn.dataset.val||'once':'once';
      var task={id:uid(),title:tt,priority:pr,done:false,createdAt:new Date().toISOString(),dueAt:dueAt,project:pj2,note:nt,recur:recur,reminder:reminder};
      su(SK.T,function(ts){ts.unshift(task)});
      // Schedule browser notification if reminder set and permission granted
      if(reminder!==null&&dueAt&&'Notification' in window&&Notification.permission==='granted'){
        var dueMs=new Date(dueAt).getTime()-(reminder*60000);
        var delay=dueMs-Date.now();
        if(delay>0)setTimeout(function(){new Notification('LifeHub: '+tt,{body:'موعد المهمة: '+dueAt.slice(0,16).replace('T',' ')})},delay);
      }
      mclose();TF='all';render();toast('تمت الإضافة','ok');
    });
  },50);
}

// ══ FINANCE ══
function rFinance(){
  var fin=sg(SK.F),txs=fin.transactions;
  var totI=txs.filter(function(t){return t.type==='income'}).reduce(function(a,t){return a+Number(t.amount)},0);
  var totE=txs.filter(function(t){return t.type==='expense'}).reduce(function(a,t){return a+Number(t.amount)},0);
  var bal=totI-totE;
  var mn=new Date().getMonth(),yn=new Date().getFullYear();
  var tm=txs.filter(function(t){var d=new Date(t.date);return d.getMonth()===mn&&d.getFullYear()===yn});
  var mI=tm.filter(function(t){return t.type==='income'}).reduce(function(a,t){return a+Number(t.amount)},0);
  var mE=tm.filter(function(t){return t.type==='expense'}).reduce(function(a,t){return a+Number(t.amount)},0);
  var sr=mI>0?Math.round((mI-mE)/mI*100):0;
  var cb={};txs.filter(function(t){return t.type==='expense'}).forEach(function(t){cb[t.category]=(cb[t.category]||0)+Number(t.amount)});
  var tc=Object.keys(cb).map(function(k){return[k,cb[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,5);

function toggleHabit(id){
  if(id==='water'){addWater(1);return}
  var td=today();
  su(SK.HB,function(hb){if(!hb[id])hb[id]={log:{}};if(!hb[id].log)hb[id].log={};var c=hb[id].log[td]?hb[id].log[td].done||false:false;hb[id].log[td]={done:!c,ts:new Date().toISOString()}});
  render();toast('تم التحديث','ok');
}
function addWater(d){
  var td=today();
  if(d===0){su(SK.HB,function(hb){if(hb.water&&hb.water.log)hb.water.log[td]={cups:0}});render();return}
  su(SK.HB,function(hb){if(!hb.water)hb.water={target:8,log:{}};if(!hb.water.log)hb.water.log={};var c=hb.water.log[td]?hb.water.log[td].cups||0:0;hb.water.log[td]={cups:Math.max(0,c+d)}});render();
}
function setWater(n){var td=today();su(SK.HB,function(hb){if(!hb.water)hb.water={target:8,log:{}};if(!hb.water.log)hb.water.log={};hb.water.log[td]={cups:n}});render()}

function openChangeCity(){
  mshow('<div class="shdl"></div><div class="sht">📍 تغيير المدينة</div><div class="field"><label>اسم المدينة</label><input class="inp" id="cI" placeholder="مثال: الرياض، Dubai" autofocus></div><button class="btn btp bb" id="applyCityBtn">تأكيد</button>');
  setTimeout(function(){
    var btn=document.getElementById('applyCityBtn');
    if(btn)btn.addEventListener('click',function(){
      var city=(document.getElementById('cI')||{}).value||'';city=city.trim();
      if(!city){toast('أدخل اسم المدينة','err');return}
      mclose();toast('جارٍ البحث...','info');
      wxGeo(city).then(function(co){
        su(SK.ST,function(s){s.lat=co.lat;s.lon=co.lon;s.city=co.name;s.wxCache=null;s.wxTs=null});
        WXD=null;WXLD=true;WXER=null;render();return wxLoad(true);
      }).then(function(d){WXD=d;WXLD=false;render()}).catch(function(e){toast(e.message,'err');WXLD=false;render()});
    });
  },50);
}

function exportData(){

function openPrayerCityModal(){
  mshow('<div class="shdl"></div><div class="sht">📍 تحديد الموقع</div><div class="field"><label>اسم المدينة</label><input class="inp" id="prCity" placeholder="مثال: الرباط، Casablanca" autofocus></div><button class="btn btp bb" id="prCityConfirm">بحث وتأكيد</button>');
  setTimeout(function(){
    var btn=document.getElementById('prCityConfirm');
    if(btn)btn.addEventListener('click',function(){searchPrayerCity()});
  },50);
}
function searchPrayerCity(){
  var inp=document.getElementById('prCity');var city=inp?inp.value.trim():'';
  if(!city){toast('أدخل اسم المدينة','err');return}
  toast('جارٍ البحث...','info');
  fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=ar')
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d.results||!d.results.length){toast('لم تُعثر على المدينة','err');return}
      var r=d.results[0];
      su(SK.PR,function(p){p.lat=r.latitude;p.lon=r.longitude;p.city=r.name;});
      _prayerCache={data:null,date:null,loading:false};
      _prayerViewData=null;_prayerViewErr=null;
      mclose();
      toast('تم تحديد الموقع: '+r.name,'ok');
      loadPrayerView();
    }).catch(function(){
      /* If geocoding fails (content:// blocks fetch), allow manual lat/lon */
      toast('تعذّر البحث عبر الإنترنت. جارٍ استخدام الموقع التلقائي.','info');
      mclose();
      loadPrayerView();
    });
}
